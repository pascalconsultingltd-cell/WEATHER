<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lido Meteo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lido Meteo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Colour tokens, light + dark. Chart colours: wind green, rain grey, temperature gold (GOLD/GREY consts in the script). */
:root {
  --bg: #eaf0f4;
  --surface: #ffffff;
  --fg: #13212b;
  --muted: #566878;
  --line: #d3dde4;
  --accent: #1d6e8c; --lido: #0a9fe6;
  --accent-soft: #d9ecf3;
  --wind: #2a72b8;
  --temp: #f07a00;
  --rain: #2f6fd1;
  --night: #0a4a96;
  --hol: #c2308f;
  --warn: #a9531a;
  --warn-soft: #f6e4d6;
  --school: #3b5bb0;
  --weekend: #fbe27a;
  --sun: #ffc800;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a22; --surface: #162630; --fg: #e5eef3; --muted: #92a6b3;
    --line: #28404d; --accent: #62bcdb; --lido: #4cc9ff; --accent-soft: #1b3a47;
    --wind: #6fb0e8; --temp: #ffa033; --rain: #8fb0ff; --night: #2f78c8; --hol: #ff8fd6;
    --warn: #e59a62; --warn-soft: #3a2a1d; --school: #9db4f0; --weekend: #6e5a10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a22; --surface: #162630; --fg: #e5eef3; --muted: #92a6b3;
  --line: #28404d; --accent: #62bcdb; --lido: #4cc9ff; --accent-soft: #1b3a47;
  --wind: #6fb0e8; --temp: #ffa033; --rain: #8fb0ff; --night: #2f78c8; --hol: #ff8fd6;
  --warn: #e59a62; --warn-soft: #3a2a1d; --school: #9db4f0; --weekend: #6e5a10; color-scheme: dark;
}

body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:13.5px; }
.wrap { margin:0 auto; padding:16px; }
/* Mobile: the chart fills the whole screen and the week is swiped sideways; the axes stay fixed either side */
html, body { height:100%; overflow:hidden; background:var(--surface); }
.chart { position:fixed; inset:0; display:flex; align-items:flex-start; background:var(--surface);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.chart svg { display:block; flex:none; }
#axL, #axR { touch-action:none; }   /* sliding up or down on an axis changes its scale */
/* Touches must land on the containers, not on the drawing inside them: the drawing is rebuilt during a pinch or an axis
   slide, and a touch that started on a removed element stops reporting its movement. */
#wxchart, #days, #axL *, #axR * { pointer-events:none; }
.chart > svg { margin-top:26px; }   /* height of the day-label row */
.scroll { flex:1; min-width:0; height:100%; overflow-x:auto; overflow-y:hidden; overscroll-behavior:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  touch-action:pan-x; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }   /* pinch and press are handled in the script */
.scroll::-webkit-scrollbar { display:none; }
.days { display:flex; }
.day { flex:none; box-sizing:border-box; overflow:clip; height:26px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); }
.day:first-child { border-left:0; }
.day.tight b { padding:6px 3px 0; font-size:12px; }
.day b { position:sticky; left:0; display:inline-block; padding:5px 8px 0; font:700 14px var(--font-display); white-space:nowrap; }
.day.we { background:var(--weekend); }
/* only shown when the forecast cannot be loaded */
.status { position:fixed; z-index:1; left:8px; right:8px; top:calc(34px + env(safe-area-inset-top)); margin:0; padding:6px 8px; border-radius:6px; background:var(--warn-soft); color:var(--warn); font:400 12px var(--font-data); }
.status:empty { display:none; }
/* gust, temperature and Lido figures, pinned at the left of the plot at their heights while the chart slides (see placeNow) */
.nowfig { position:fixed; z-index:1; pointer-events:none; font-family:"DM Mono", monospace; font-weight:700;
  text-shadow:0 0 2px var(--surface), 0 0 2px var(--surface), 0 0 3px var(--surface); }
.nowfig > div { position:absolute; display:flex; align-items:center; gap:3px; line-height:1; white-space:nowrap; transform:translateY(-78%); }
.nowfig small { font-size:0.42em; margin-left:-2px; }
/* how many days fill the screen: four buttons over the right end of the day banner */
.zoomsel { position:fixed; z-index:2; top:env(safe-area-inset-top); right:env(safe-area-inset-right); height:30px; display:flex; align-items:center; gap:4px; padding:0 5px; border-bottom-left-radius:8px;
  background:var(--surface); border-left:1px solid var(--line); border-bottom:1px solid var(--line); box-sizing:border-box; }
.zoomsel button { margin:0; padding:0; width:40px; height:25px; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--muted);
  font:700 13.5px var(--font-display); -webkit-tap-highlight-color:transparent; }
.zoomsel button.on { background:#0b3d91; border-color:#0b3d91; color:#fff; }
/* the place button opens a search box in its place: a city name, or empty for home */
#placeb { width:auto; padding:0 8px; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#placein { display:none; width:150px; height:25px; box-sizing:border-box; border:1px solid var(--line); border-radius:13px; padding:0 9px;
  font:500 13.5px var(--font-body); background:var(--surface); color:var(--fg); }
.zoomsel.edit button { display:none; }
.zoomsel.edit #placein { display:block; }
</style></head><body>
<p class="status" id="status"></p>
<div class="nowfig" id="nowfig"></div>
<div class="zoomsel" id="zoomsel"><button id="placeb"></button><input id="placein" placeholder="City, empty = home" enterkeyhint="go"><button data-h="-1">Now</button><button data-h="36">1.5d</button><button data-h="72">3d</button><button data-h="168">7d</button></div>
<div class="chart" id="chart">
  <svg id="axL"></svg>
  <div class="scroll"><div class="days" id="days"></div><svg id="wxchart" role="img" aria-label="Hourly forecast chart, 14 days"></svg></div>
  <svg id="axR"></svg>
</div>
<script>
// Location and display settings. Forecast comes from Open-Meteo (free, no API key).
var PLACE = 'NW5 London', LAT = 51.553, LON = -0.142, TZ = 'Europe/London', HOME_PLACE = [PLACE, LAT, LON, TZ], AWAY = false;
var DAYS = 14;                   // number of days to chart, starting today (the 7d button shows 7 of them, slide for the rest)
var ZOOM = 1.3;                  // screen px per chart unit: bigger = larger text
var FIT_HOURS = -1;              // hours across the screen: the "Now" view when the app opens, then whatever the buttons on top set (0 = the whole week, -1 = from now to sunset, or after sunset to an hour past tomorrow's sunrise)
var BUILD = '2026-10-19h';       // change on every release: a page still running an older build reloads itself
var PXH_MAX = 47;                // most screen px per hour when pinching in (pinching out stops when the whole week is on screen)
var RAIN_SPLIT = 0.208;         // share of the panels' height given to the rain panel at the top (temperature and wind share the rest)
var WARM = 18;                   // °C: the band between temperature and feels-like is drawn darker above this level
var NOW_ROOM = 0;                // chart units kept left of the now line in the "Now" view (0: the now line is the left edge, so the pinned figures read now)
var PAST_HOURS = 10;             // hours before now at the left edge when the app opens (room for the figures beside the now line)
var BACK_HOURS = 16;             // how far before now the chart can be dragged back
var REFRESH_MIN = 10;            // re-fetch interval while the page is open
// Hampstead Heath Lido water temperature, saved to the repo by a scheduled job (the City of London publishes it about weekly)
// (read from the site's own copy, always revalidated: the raw.githubusercontent.com copy can be 5 minutes stale; that one serves a page opened from a file)
var LIDO_URL = location.protocol.indexOf('http') === 0 ? 'lido.json' : 'https://raw.githubusercontent.com/pascalconsultingltd-cell/WEATHER/main/lido.json', LIDO = null;
var ICON_BASE = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg-static/';
var PXH = 0, USER_ZOOM = false, PLOTW = 0;   // screen px per hour (set to fit FIT_HOURS until the user pinches), width of the plot on screen
var VS = 1, VO = 0;                          // vertical stretch and shift of the wind and temperature scales, set by sliding on an axis (1 and 0 = automatic)
var HOMED = false, SLID = 0;                 // the chart has been placed on "now"; when the chart was last slid (ms)
var VIEW = null, CROSS = null;               // geometry of the last drawing, and the crosshair {i: hour index, y: chart units}

// One continuous chart. d: {WIND, GUST (km/h), RAIN (% chance), MM (mm of rain in the hour), TEMP (C), FEEL (feels-like, C), DIR (bearing wind comes FROM), ICON} per hour from 00:00 on day 0,
// SUN: [[sunrise, sunset], ...] per day in decimal hours, DAYS: [{label, short, we}] per day, NOW: hours since 00:00 on day 0, TODAY: index of today.
function drawWeek(d) {
  var WIND = d.WIND, GUST = d.GUST, RAIN = d.RAIN, MM = d.MM, TEMP = d.TEMP, FEEL = d.FEEL, DIR = d.DIR, ICON = d.ICON;
  var chartEl = document.getElementById('chart'), AL = 26, AR = 33;
  PLOTW = Math.max(60, chartEl.clientWidth - (AL + AR) * ZOOM);   // never negative while the page is still being laid out
  var hr = d.NOW - d.TODAY * 24, dusk = d.SUN[d.TODAY][1];   // "Now" view ends at sunset, or once that has passed an hour after tomorrow's sunrise
  if (!USER_ZOOM) PXH = FIT_HOURS < 0 ? Math.min(PXH_MAX, Math.max(20, PLOTW - NOW_ROOM * ZOOM) / ((hr < dusk ? dusk : 25 + d.SUN[d.TODAY + 1][0]) - hr))
    : PLOTW / (FIT_HOURS || WIND.length - Math.max(0, Math.floor(d.NOW) - PAST_HOURS));   // 0 = from the opening position to the end of the week
  [].forEach.call(document.querySelectorAll('#zoomsel button'), function (b) { b.className = !USER_ZOOM && +b.getAttribute('data-h') === FIT_HOURS ? 'on' : ''; });
  var n = WIND.length, step = PXH / ZOOM, W = n * step, H = Math.max(200, Math.floor((chartEl.clientHeight - 26) / ZOOM)), T = 6, MT = T + 2, B = 4, ih = H - T - B;   // the sun and moon sit at the top of the panel (MT), in the rain zone
  // top to bottom: the sky icons, then one panel (top TT = WT = T, floor TF = WF = T + ihU, height TH)
  // holding temperature and wind with rain hanging upside down from its top (down to RB, height RH), then the band of day names
  var PANELS = ih - 4 - 23;
  var RH = Math.round(PANELS * RAIN_SPLIT), RTOP = T, RB = T + RH;
  var TT = T, WT = TT, WF = T + ih - 23, TF = WF, TH = WF - TT, ihU = WF - T;
  var HOME = Math.max(0, Math.floor(d.NOW) - PAST_HOURS), H0 = Math.max(0, Math.floor(d.NOW) - BACK_HOURS), X0 = H0 * step;   // hour at the left edge on opening; first hour drawn
  // how often things are drawn, so they never overlap when the time axis is squeezed
  function every(list, min) { for (var q = 0; q < list.length - 1 && list[q] * step < min; q++); return list[q]; }
  var SPAN = PLOTW / PXH, FULL = SPAN > 48, CANDLE = SPAN > 100;   // hours on screen: from 3 days the comets fill the panel, from 7 temperature is drawn as daily min-max bars
  var HK = every([1, 2, 3, 6, 12], 18), BK = every([1, 2, 3, 4, 6, 8, 12, 24], 26);   // hour labels, wind barbs
  var RMAX = Math.min(100, Math.max(30, Math.ceil(Math.max.apply(null, RAIN) / 30) * 30));
  var MMAX = [1, 2, 4, 6, 10, 20, 40].filter(function (m) { return m >= Math.max.apply(null, MM); })[0] || 80;   // mm scale of the rain bars
  // Lido water temperature for each day on the chart: today's figure, then each later day moves 0.17 of the way towards
  // that day's mean daytime air temperature + 0.1 (the same rule as scripts/lido.py). Days before today repeat today's figure.
  var POOL = [];
  if (LIDO && LIDO.lido != null) {
    var water = LIDO.estimate != null ? LIDO.estimate : LIDO.lido;
    d.SUN.forEach(function (s, k) {
      var sum = 0, cnt = 0;
      for (var i = k * 24 + Math.ceil(s[0]); i <= k * 24 + Math.floor(s[1]); i++) { sum += TEMP[i]; cnt++; }
      if (k > d.TODAY && cnt) water += 0.17 * (sum / cnt + 0.1 - water);
      POOL.push(water);
    });
  }
  var wt = TEMP.slice(H0).concat(FEEL.slice(H0), POOL.slice(Math.floor(H0 / 24))), tLo = Math.min.apply(null, wt);   // the feels-like and Lido curves too
  // temperature is set on the week from the first hour drawn, so nothing leaves the panel when the chart slides: the coldest
  // value at 8% of the height, the warmest at 78% (the wind spreads around the curve, the fraction goes above), at least 4 degrees across
  var TSPAN = (Math.max(Math.max.apply(null, wt), tLo + 4) - tLo) / 0.7, TMIN = tLo - 0.08 * TSPAN, TMAX = TMIN + TSPAN;
  var GOLD = '#e0a800', GREY = '#7d8993';
  var RC = 'var(--rain)';   // rain colour
  var mono = 'font-family="DM Mono, monospace"';
  var FS = Math.max(12, Math.min(24, step * 24 * 0.42));   // big figures (day fraction, highs and lows, Lido): shrink to fit a narrow day
  var HALO = 'stroke="var(--surface)" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"', BIG = 'text-anchor="middle" font-size="' + FS + '" font-weight="700" stroke-width="4" paint-order="stroke" ' + HALO + ' ' + mono;
  var WIDE = step * 24 >= 130, SFS = FS * (WIDE ? 0.8 : 0.55), KMH = '<tspan dx="1.5" style="font-size:' + Math.max(7, SFS * 0.4) + 'px">km/h</tspan>';   // a day is wide enough for big figures beside its fraction; size of the Lido and peak gust figures
  function x(i) { return (i + 0.5) * step; }
  // Sliding on an axis stretches the temperature scale from the floor by VS and moves it by VO0
  // (VO is kept relative to the floor, where the axis gestures anchor)
  var VO0 = VO - WF * (1 - VS);
  // wind is drawn around the temperature band (between temperature and feels-like, middle wy): beyond its edges it reaches as
  // far out as the gust is strong (WH above the upper edge and below the lower one at 50 km/h)
  var WH = 0.26 * TH;
  function wy(i) { return (yT(TEMP[i]) + yT(FEEL[i])) / 2; }
  function wedge(i, sgn) { return sgn < 0 ? Math.min(yT(TEMP[i]), yT(FEEL[i])) : Math.max(yT(TEMP[i]), yT(FEEL[i])); }   // upper or lower edge
  function yT(v) { return TF - VS * ((v - TMIN) / (TMAX - TMIN)) * TH + VO0; }
  function vT(y) { return TMIN + (TF + VO0 - y) / VS / TH * (TMAX - TMIN); }         // temperature at a height
  function yR(v) { return RTOP + (v / RMAX) * RH; }   // rain grows downwards from the top of its panel
  function yM(v) { return RTOP + (v / MMAX) * RH; }
  function clampY(y, b) { return b ? Math.min(b[1], Math.max(b[0], y)) : y; }
  function curve(pts, cont, b) {   // b: [top, floor] the control points stay within (the upper panels are clipped instead)
    var d = (cont ? ' L' : 'M') + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = clampY(p1[1] + (p2[1] - p0[1]) / 6, b);
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = clampY(p2[1] - (p3[1] - p1[1]) / 6, b);
      d += ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2[0] + ',' + p2[1];
    }

  }
  var out = '', axL = '', axR = '';
  var MARINE = '#0b3d91';
  // under the wind panel: a band of background with the days again
  function divider() {
    var band = '<rect x="0" y="' + (WF + 0.5) + '" width="' + W + '" height="' + (T + ih - WF - 0.5) + '" fill="var(--surface)"/>';
    // the days again in that band (weekends in yellow), each name centred on the part of its day that is on the chart
    d.DAYS.forEach(function (day, k) {
      var a = Math.max(k * 24, H0) * step, b = (k + 1) * 24 * step, w = b - a;
      if (w <= 0) return;

      if (day.we) band += '<rect x="' + a + '" y="' + (WF + 0.5) + '" width="' + w + '" height="' + (T + ih - WF - 0.5) + '" fill="var(--weekend)"/>';
      if (k) band += '<line x1="' + a + '" x2="' + a + '" y1="' + WF + '" y2="' + (T + ih) + '" stroke="var(--line)" stroke-width="1"/>';

    });
    return band;
  }
  function xt(t) { return Math.min(W, Math.max(0, x(0) + t * step)); }   // t = hours since 00:00 on day 0
  var nTop = 2, nH = T + ih - nTop;
  // night shading melts in and out around sunrise and sunset (soft gradient, no hard edge)
  var MELT = 0.7;   // hours of fade each side of the boundary
  function nightRect(id, xa, xb, op0, op1) {
    out += '<defs><linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" x1="' + xa + '" x2="' + xb + '" y1="0" y2="0"><stop offset="0" stop-color="var(--night)" stop-opacity="' + op0 + '"/><stop offset="1" stop-color="var(--night)" stop-opacity="' + op1 + '"/></linearGradient></defs>';
    out += '<rect x="' + xa + '" y="' + nTop + '" width="' + (xb - xa) + '" height="' + nH + '" fill="url(#' + id + ')"/>';
  }
  function solidNight(xa, xb) {
    out += '<rect x="' + xa + '" y="' + nTop + '" width="' + Math.max(0, xb - xa) + '" height="' + nH + '" fill="var(--night)" fill-opacity="0.38"/>';
  }
  if (!CANDLE) d.SUN.forEach(function (s, k) {   // none on the 7-day view
    var rise = k * 24 + s[0], set = k * 24 + s[1];
    var prevSet = k ? (k - 1) * 24 + d.SUN[k - 1][1] : null;
    solidNight(k ? xt(prevSet + MELT) : 0, xt(rise - MELT));
    nightRect('wxnr' + k, xt(rise - MELT), xt(rise + MELT), 0.38, 0);
    nightRect('wxns' + k, xt(set - MELT), xt(set + MELT), 0, 0.38);
    if (k === d.SUN.length - 1) solidNight(xt(set + MELT), W);
  });
  // the background follows each hour's sky: yellow when sunny (fainter when partly cloudy), grey when cloudy, darker grey
  // when wet; a yellow and a grey layer, each averaged over about 20 units either side so the spells fade into each other.
  // The cloud space gets a stronger yellow of its own when sunny, fading out downwards over twice the rain panel's height
  function skyOf(i) { var w = ICON[i][1]; return /rain|drizzle|thunder|sleet|snow/.test(w) || MM[i] >= 0.2 ? 4 : /overcast|fog/.test(w) ? 3 : w === 'partly-cloudy-day' ? 2 : w === 'clear-day' ? 1 : 0; }
  var SAVG = Math.max(1, Math.round(10 / step));   // hours averaged either side
  out += '<defs><linearGradient id="wxfadeg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
    '<mask id="wxfade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#wxfadeg)"/></mask></defs>';
  [['var(--sun)', [0, 0.25, 0.1, 0, 0], nTop, nH], [GREY, [0, 0, 0, 0.12, 0.28], nTop, nH], ['var(--sun)', [0, 0.5, 0.25, 0, 0], RTOP, RH * 2]].forEach(function (L, li) {
    for (var si = H0, sst = ''; si < n; si++) {
      for (var sq = Math.max(H0, si - SAVG), sv = 0, sc = 0; sq <= Math.min(n - 1, si + SAVG); sq++, sc++) sv += L[1][skyOf(sq)];
      sst += '<stop offset="' + ((si + 0.5) / n).toFixed(4) + '" stop-color="' + L[0] + '" stop-opacity="' + (sv / sc).toFixed(3) + '"/>';
    }
    out += '<defs><linearGradient id="wxsky' + li + '" gradientUnits="userSpaceOnUse" x1="0" x2="' + W + '" y1="0" y2="0">' + sst + '</linearGradient></defs>' +
      '<rect x="' + H0 * step + '" y="' + L[2] + '" width="' + (n - H0) * step + '" height="' + L[3] + '" fill="url(#wxsky' + li + ')"' + (li === 2 ? ' mask="url(#wxfade)"' : '') + '/>';
  });
  // moon phase, drawn in the sky in the middle of each night
  function drawMoons() {
    var r = step * 24 < 50 ? 9 : 14;
    for (var k = -1; k < d.SUN.length; k++) {
      var a = k < 0 ? -0.5 : k * 24 + d.SUN[k][1], b = k + 1 < d.SUN.length ? (k + 1) * 24 + d.SUN[k + 1][0] : n - 0.5;
      a = Math.max(a, H0 - 0.5);                      // only the part of the night still on the chart
      if (b - a < 3) continue;
      var t = (a + b) / 2, m = moon(d.T0 + t * 3600000), cx = xt(t), cy = MT + r + 7;
      var label = ((b - a) * step < 95 ? '' : m.name + ' ') + Math.round(m.lit * 100) + '%';   // no room for the name when squeezed
      cx = Math.max(cx, X0 + Math.max(r, label.length * 2.5) + 3);   // kept whole at the left edge
      var p = m.phase < 0.5 ? m.phase : 1 - m.phase;                 // mirrored for the waning half

  if (v.POOL.length) f.push([v.yT(v.POOL[k]) + S * 0.3, 'var(--lido)', '<svg width="' + 13 * ZOOM + '" height="' + 8 * ZOOM + '" viewBox="-0.5 -5 16 10"><path d="M0,-2.5 q2.5,-3 5,0 t5,0 t5,0 M0,2.5 q2.5,-3 5,0 t5,0 t5,0" fill="none" stroke="var(--lido)" stroke-width="1.8" stroke-linecap="round"/></svg>' + Math.floor(v.POOL[k] + 1e-6) + '°', 1]);
  var box = document.getElementById('axL').getBoundingClientRect();
  el.style.cssText = 'left:' + box.right + 'px;top:' + box.top + 'px;width:' + PLOTW + 'px';
  el.innerHTML = f.filter(function (q) { return q[0] > v.TT + S * 0.8 && q[0] < v.T + v.ihU; }).map(function (q) {
    return '<div style="' + (q[3] ? 'right:3px' : 'left:3px') + ';top:' + q[0] * ZOOM + 'px;color:' + q[1] + ';font-size:' + S * (q[3] ? 0.8 : 1) * ZOOM + 'px">' + q[2] + '</div>';
  }).join('') + '<div style="left:3px;top:' + (v.RTOP + 4 + S * 0.55) * ZOOM + 'px;color:' + v.RC + ';font-size:' + S * 2 / 3 * ZOOM + 'px">' +
    at(d.RAIN) + '% <span style="color:' + v.MARINE + '">' + d.MM[Math.floor(h)] + '<small>mm/h</small></span></div>';
}
document.querySelector('.scroll').addEventListener('scroll', function () { SLID = Date.now(); placeNow(); }, { passive: true });

// Crosshair: a line on one hour with that hour's values in a tag beside it, and a level line whose value is read on the axes.
function drawCross() {
  var v = VIEW, g = document.getElementById('wxcross'), gl = document.getElementById('axLcross'), gr = document.getElementById('axRcross');
  if (!v || !g) return;
  if (CROSS && (CROSS.i < v.H0 || CROSS.i >= v.n)) CROSS = null;
  if (!CROSS) { g.innerHTML = gl.innerHTML = gr.innerHTML = ''; return; }
  var d = v.d, i = CROSS.i, cx = v.x(i), bot = v.T + v.ih, cy = Math.min(bot, Math.max(v.T, CROSS.y)), h = i % 24, mono = v.mono;
  var o = '<line x1="' + cx + '" x2="' + cx + '" y1="' + v.T + '" y2="' + bot + '" stroke="var(--fg)" stroke-width="1"/>' +
    '<line x1="' + v.X0 + '" x2="' + v.W + '" y1="' + cy + '" y2="' + cy + '" stroke="var(--fg)" stroke-width="0.7" stroke-opacity="0.6"/>';
  [[v.yT(d.FEEL[i]), 'var(--surface)', v.GOLD], [v.yT(d.TEMP[i]), v.GOLD, 'var(--surface)'], [v.yR(d.RAIN[i]), v.RC, 'var(--surface)', 1]].forEach(function (p) {
    if (p[3] || (p[0] >= v.T - 1 && p[0] <= v.T + v.ihU + 1)) o += '<circle cx="' + cx + '" cy="' + p[0] + '" r="3.4" fill="' + p[1] + '" stroke="' + p[2] + '" stroke-width="1.4"/>';
  });
  var rows = [
    ['var(--fg)', d.DAYS[Math.floor(i / 24)].short + ' · ' + (h < 10 ? '0' : '') + h + ':00'],
    ['var(--wind)', 'Wind ' + d.WIND[i] + ' · gust ' + d.GUST[i] + ' ' + ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'][Math.round(d.DIR[i] / 45) % 8]],
    [v.GOLD, 'Temp ' + d.TEMP[i] + '° · feels ' + d.FEEL[i] + '°'],
    [v.RC, 'Rain ' + d.RAIN[i] + '% · ' + d.MM[i] + ' mm']

  rows.forEach(function (r, k) {
    o += '<text x="' + (bx + 7) + '" y="' + (by + 17 + k * 16) + '" font-size="13" font-weight="' + (k ? 500 : 700) + '" fill="' + r[0] + '" ' + mono + '>' + r[1] + '</text>';
  });
  g.innerHTML = o;
  // what the level line reads on each axis: wind on the left and temperature on the right; in the rain panel, mm on the left and chance on the right
  function chip(xa, w, txt, col) {
    return '<rect x="' + xa + '" y="' + (cy - 6.5) + '" width="' + w + '" height="13" rx="2" fill="var(--surface)" stroke="' + col + '" stroke-width="0.7"/>' +
      '<text x="' + (xa + w / 2) + '" y="' + (cy + 3.7) + '" text-anchor="middle" font-size="10.5" font-weight="700" fill="' + col + '" ' + mono + '>' + txt + '</text>';
  }

  gl.innerHTML = cy >= v.RTOP && cy <= v.RB ? chip(1, 24, ((cy - v.RTOP) / (v.RB - v.RTOP) * v.MMAX).toFixed(1), v.MARINE) : '';
  gr.innerHTML = cy >= v.TT && cy <= v.TF ? chip(1, 31, Math.round(v.vT(cy)) + '°', v.GOLD)
    : cy >= v.RTOP && cy <= v.RB ? chip(1, 31, Math.round((cy - v.RTOP) / (v.RB - v.RTOP) * v.RMAX) + '%', v.RC) : '';
}
// WMO weather code -> [emoji, Meteocons icon name]
function icon(code, isDay) {
  var dn = isDay ? 'day' : 'night';
  if (code === 0) return [isDay ? '☀️' : '🌙', 'clear-' + dn];
  if (code === 1) return [isDay ? '🌤️' : '🌙', 'partly-cloudy-' + dn];
  if (code === 2) return [isDay ? '⛅' : '☁️', 'overcast-' + dn];
  if (code === 3) return ['☁️', 'overcast'];
  if (code === 45 || code === 48) return ['🌫️', 'fog'];
  if (code >= 51 && code <= 57) return ['🌦️', 'drizzle'];
  if (code === 66 || code === 67) return ['🌧️', 'sleet'];
  if (code >= 61 && code <= 65) return ['🌧️', 'rain'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['🌨️', 'snow'];
  if (code === 80) return ['🌦️', 'partly-cloudy-' + dn + '-rain'];
  if (code === 81 || code === 82) return ['🌧️', 'rain'];
  if (code >= 95) return ['⛈️', 'thunderstorms-rain'];
  return ['☁️', 'overcast'];
}
// Moon phase at a given time (ms): phase 0 = new, 0.5 = full; lit = illuminated fraction
function moon(ms) {
  var SYNODIC = 29.530588853, NEW0 = Date.UTC(2000, 0, 6, 18, 14);   // a reference new moon
  var ph = ((ms - NEW0) / 86400000 / SYNODIC) % 1;
  if (ph < 0) ph += 1;
  var names = ['New', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  return { phase: ph, lit: (1 - Math.cos(2 * Math.PI * ph)) / 2, name: names[Math.round(ph * 8) % 8] };
}
function decHour(iso) { return +iso.slice(11, 13) + (+iso.slice(14, 16)) / 60; }
function num(v) { return v == null ? 0 : Math.round(v); }

var lastLoad = 0, lastData = null;
function render(j) {
  var h = j.hourly, nDays = j.daily.time.length, n = nDays * 24;
  var d = { WIND: [], GUST: [], RAIN: [], MM: [], TEMP: [], FEEL: [], DIR: [], ICON: [], SUN: [] };
  for (var i = 0; i < n; i++) {
    d.WIND.push(num(h.wind_speed_10m[i]));
    d.GUST.push(Math.max(num(h.wind_gusts_10m[i]), num(h.wind_speed_10m[i])));
    d.RAIN.push(num(h.precipitation_probability[i]));
    d.MM.push(Math.round((h.precipitation[i] || 0) * 10) / 10);
    d.TEMP.push(num(h.temperature_2m[i]));
    d.FEEL.push(num(h.apparent_temperature[i]));
    d.DIR.push(h.wind_direction_10m[i] || 0);
    d.ICON.push(icon(h.weather_code[i], h.is_day[i]));
  }

  var loc = new Date(Date.now() + j.utc_offset_seconds * 1000);
  d.TODAY = Math.max(0, j.daily.time.indexOf(loc.toISOString().slice(0, 10)));   // which of the days is today (the first one is yesterday)
  d.NOW = d.TODAY * 24 + loc.getUTCHours() + loc.getUTCMinutes() / 60;
  d.T0 = Date.parse(j.daily.time[0] + 'T00:00:00Z') - j.utc_offset_seconds * 1000;   // 00:00 local on day 0
  d.DAYS = [];
  j.daily.time.forEach(function (date, k) {
    d.SUN.push([decHour(j.daily.sunrise[k]), decHour(j.daily.sunset[k])]);
    var dt = new Date(date + 'T12:00:00Z'), dow = dt.getUTCDay();
    d.DAYS.push({
      label: dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'UTC' }),
      short: dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', timeZone: 'UTC' }),
      we: dow === 0 || dow === 6
    });
  });
  drawWeek(d);
  document.getElementById('status').textContent = '';
}
// The app keeps this page open for days, so it checks for a newer build each time it loads the forecast and reloads itself once.
function checkBuild() {
  if (location.protocol.indexOf('http') !== 0) return;
  fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
    var m = /var BUILD = '([^']+)'/.exec(t), tried = null;
    try { tried = sessionStorage.getItem('build'); } catch (e) {}
    if (!m || m[1] === BUILD || m[1] === tried) return;
    try { sessionStorage.setItem('build', m[1]); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
  }).catch(function () {});
}
// Another place can be looked up with the place button (Open-Meteo's geocoder); it is kept until home is chosen again.
// The Lido figures belong to home only.
function setPlace(p) {
  PLACE = p[0]; LAT = p[1]; LON = p[2]; TZ = p[3]; AWAY = LAT !== HOME_PLACE[1] || LON !== HOME_PLACE[2];
  if (AWAY) LIDO = null;
  document.getElementById('placeb').textContent = AWAY ? PLACE : PLACE.split(' ')[0];
}
try { setPlace(JSON.parse(localStorage.getItem('place')) || HOME_PLACE); } catch (e) { setPlace(HOME_PLACE); }
(function () {
  var zs = document.getElementById('zoomsel'), inp = document.getElementById('placein');
  document.getElementById('placeb').addEventListener('click', function () { zs.className = 'zoomsel edit'; inp.value = ''; inp.focus(); });
  inp.addEventListener('blur', function () { zs.className = 'zoomsel'; });
  inp.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var q = inp.value.trim();
    inp.blur();
    function go(p) {
      setPlace(p);
      try { if (AWAY) localStorage.setItem('place', JSON.stringify(p)); else localStorage.removeItem('place'); } catch (e) {}
      SLID = 0; load();
    }
    if (!q || /^home$/i.test(q)) return go(HOME_PLACE);
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=' + encodeURIComponent(q)).then(function (r) { return r.json(); })
      .then(function (g) {
        var r = g.results && g.results[0];
        if (r) go([r.name, r.latitude, r.longitude, r.timezone || 'auto']);
        else document.getElementById('status').textContent = 'No place called ' + q;
      })
      .catch(function () { document.getElementById('status').textContent = 'Could not look up ' + q; });
  });
})();
function load() {
  checkBuild();
  if (!AWAY) fetch(LIDO_URL, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (v) { if (v && !AWAY) { LIDO = v; if (lastData) render(lastData); } })
    .catch(function () {});   // the chart works without it
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m,is_day' +
    '&daily=sunrise,sunset&wind_speed_unit=kmh&timezone=' + encodeURIComponent(TZ) + '&forecast_days=' + DAYS + '&past_days=1';   // yesterday too, for the hours before now
  fetch(url).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (j) {
      // a fresh forecast puts the chart back on "now" (the now line at its usual place) unless it was slid in the last 2 minutes
      if (Date.now() - SLID > 120000) HOMED = false;
      lastLoad = Date.now(); lastData = j; render(j);
    })
    .catch(function (e) {
      document.getElementById('status').textContent = 'Could not load forecast (' + e.message + '). Retrying in ' + REFRESH_MIN + ' min.';
    });
}
load();
// installable app: the service worker keeps the app and the last forecast available offline
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js');
// Touch: a tap or a press puts the crosshair on that hour (keep the finger down to drag it, tap again to remove it);
// dragging up or down in the top panel moves the wind and temperature curves (a tap on an axis puts them back);
// a two-finger pinch squeezes or stretches the time axis around the fingers. A plain swipe still scrolls the week.
(function () {
  var sc = document.querySelector('.scroll'), svg = document.getElementById('wxchart');
  var mode = '', sx = 0, sy = 0, timer = 0, pinch = null, want = null, o0 = 0, lifting = false;
  function point() {
    var v = VIEW, r = svg.getBoundingClientRect();
    if (!v) return;
    var i = Math.round((v.X0 + (sx - r.left) / ZOOM) / v.step - 0.5);
    CROSS = { i: Math.min(v.n - 1, Math.max(v.H0, i)), y: (sy - r.top) / ZOOM };
    drawCross();
  }
  function span(e) {
    var a = e.touches[0], b = e.touches[1];
    return { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1, x: (a.clientX + b.clientX) / 2 };
  }
  function zoom() {
    var w = want;
    want = null;
    if (!w || !VIEW) return;
    PXH = Math.min(PXH_MAX, Math.max(PLOTW / (VIEW.n - VIEW.HOME), w.pxh));
    USER_ZOOM = true;
    drawWeek(VIEW.d);
    sc.scrollLeft = w.hour * PXH - (w.x - sc.getBoundingClientRect().left);   // the hour between the fingers stays between them
  }
  sc.addEventListener('touchstart', function (e) {
    clearTimeout(timer);
    if (e.touches.length === 2) {
      var s = span(e);
      mode = 'pinch'; CROSS = null; drawCross();
      sc.style.overflowX = 'hidden';   // stops the browser scrolling under the pinch; the chart is placed by hand until it ends
      pinch = { dist: s.dist, pxh: PXH, hour: (s.x - svg.getBoundingClientRect().left) / PXH };
    } else if (e.touches.length === 1) {
      mode = 'press'; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      timer = setTimeout(function () { mode = 'cross'; point(); }, 250);
    }
  }, { passive: true });
  sc.addEventListener('touchmove', function (e) {
    if (mode === 'pinch' && e.touches.length === 2) {

      e.preventDefault();
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      point();
    } else if (mode === 'press' && (Math.abs(e.touches[0].clientX - sx) > 8 || Math.abs(e.touches[0].clientY - sy) > 8)) {
      clearTimeout(timer);
      // a drag that goes up or down, starting in the wind and temperature panel, moves those two scales; sideways scrolls the week
      var up = Math.abs(e.touches[0].clientY - sy) > Math.abs(e.touches[0].clientX - sx);
      mode = up && VIEW && (sy - svg.getBoundingClientRect().top) / ZOOM <= VIEW.T + VIEW.ihU ? 'lift' : 'scroll';
      o0 = VO;
    }
    if (mode === 'lift') {
      e.preventDefault();
      VO = Math.min(o0 + VIEW.ihU, Math.max(o0 - VIEW.ihU, o0 + (e.touches[0].clientY - sy) / ZOOM));

  // On either axis, for the wind and temperature scales together:
  //  - sliding up stretches them and sliding down squeezes them, smoothly, around the level under the finger;
  //  - pressing first (a quarter of a second) and then sliding moves them up or down instead;
  //  - a tap goes back to the automatic scale.
  function axis(id) {
    var el = document.getElementById(id), y0 = 0, s0 = 1, o0 = 0, yc = 0, ya = 0, how = '', hold = 0, busy = false;
    function redraw() { if (!busy) { busy = true; requestAnimationFrame(function () { busy = false; drawWeek(VIEW.d); }); } }
    el.addEventListener('touchstart', function (e) {
      if (!VIEW) return;
      y0 = e.touches[0].clientY; how = ''; s0 = VS; o0 = VO;
      yc = Math.min(VIEW.T + VIEW.ihU, Math.max(VIEW.T, (y0 - el.getBoundingClientRect().top) / ZOOM));   // where the finger is, in chart units
      ya = (yc - VO) / VS;                                                                                // and what is drawn there
      clearTimeout(hold);
      hold = setTimeout(function () { if (!how) { how = 'move'; el.style.background = 'var(--accent-soft)'; } }, 250);   // the axis tints while it can be moved
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      if (!VIEW) return;
      e.preventDefault();

      if (how === 'stretch') {
        VS = Math.min(8, Math.max(0.5, s0 * Math.exp(dy / 160)));
        VO = yc - VS * ya;
        if (o0 >= floor * (1 - s0) - 0.01) VO = Math.max(VO, floor * (1 - VS));   // 0 km/h stays on the floor of the panel unless it was moved off it
      } else if (how === 'move') {
        VO = Math.min(o0 + VIEW.ihU, Math.max(o0 - VIEW.ihU, o0 - dy / ZOOM));
      } else return;

  }

})();
// The buttons on top set how many days fill the screen, keeping the hour at the left edge where it is.
document.getElementById('zoomsel').addEventListener('click', function (e) {

  sc.scrollLeft = FIT_HOURS < 0 ? (VIEW.d.NOW + 0.5 - VIEW.H0) * PXH - NOW_ROOM * ZOOM : (FIT_HOURS ? hour : VIEW.HOME - VIEW.H0) * PXH;
});
// redraw to the new height when the phone is rotated
window.addEventListener('resize', function () {
  if (!lastData) return;
  var sc = document.querySelector('.scroll'), hour = PXH ? sc.scrollLeft / PXH : 0;   // the hour at the left edge stays there
  render(lastData);

setInterval(load, REFRESH_MIN * 60000);

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - lastLoad > 60000) load();
});
