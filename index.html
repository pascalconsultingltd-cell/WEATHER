<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weather">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* Colour tokens, light + dark. Chart colours: wind green, rain grey, temperature gold (GOLD/GREY consts in the script). */
:root {
  --bg: #eaf0f4;
  --surface: #ffffff;
  --fg: #13212b;
  --muted: #566878;
  --line: #d3dde4;
  --accent: #1d6e8c;
  --accent-soft: #d9ecf3;
  --wind: #14b24c;
  --temp: #f07a00;
  --rain: #2f6fd1;
  --night: #0a4a96;
  --hol: #c2308f;
  --warn: #a9531a;
  --warn-soft: #f6e4d6;
  --school: #3b5bb0;
  --weekend: #fbe27a;
  --sun: #ffc800;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a22; --surface: #162630; --fg: #e5eef3; --muted: #92a6b3;
    --line: #28404d; --accent: #62bcdb; --accent-soft: #1b3a47;
    --wind: #3ddc84; --temp: #ffa033; --rain: #8fb0ff; --night: #2f78c8; --hol: #ff8fd6;
    --warn: #e59a62; --warn-soft: #3a2a1d; --school: #9db4f0; --weekend: #6e5a10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a22; --surface: #162630; --fg: #e5eef3; --muted: #92a6b3;
  --line: #28404d; --accent: #62bcdb; --accent-soft: #1b3a47;
  --wind: #3ddc84; --temp: #ffa033; --rain: #8fb0ff; --night: #2f78c8; --hol: #ff8fd6;
  --warn: #e59a62; --warn-soft: #3a2a1d; --school: #9db4f0; --weekend: #6e5a10; color-scheme: dark;
}

body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:13.5px; }
.wrap { margin:0 auto; padding:16px; }
/* Mobile: the chart fills the whole screen and the week is swiped sideways; the axes stay fixed either side */
html, body { height:100%; overflow:hidden; background:var(--surface); }
.chart { position:fixed; inset:0; display:flex; align-items:flex-start; background:var(--surface);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.chart svg { display:block; flex:none; }
#axL, #axR { touch-action:none; }   /* sliding up or down on an axis changes its scale */
/* Touches must land on the containers, not on the drawing inside them: the drawing is rebuilt during a pinch or an axis
   slide, and a touch that started on a removed element stops reporting its movement. */
#wxchart, #days, #axL *, #axR * { pointer-events:none; }
.chart > svg { margin-top:26px; }   /* height of the day-label row */
.scroll { flex:1; min-width:0; height:100%; overflow-x:auto; overflow-y:hidden; overscroll-behavior:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  touch-action:pan-x; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }   /* pinch and press are handled in the script */
.scroll::-webkit-scrollbar { display:none; }
.days { display:flex; }
.day { flex:none; box-sizing:border-box; overflow:clip; height:26px; border-left:1px solid var(--line); border-bottom:1px solid var(--line); }
.day:first-child { border-left:0; }
.day.tight b { padding:6px 3px 0; font-size:12px; }
.day b { position:sticky; left:0; display:inline-block; padding:5px 8px 0; font:700 14px var(--font-display); white-space:nowrap; }
.day.we { background:var(--weekend); }
/* only shown when the forecast cannot be loaded */
.status { position:fixed; z-index:1; left:8px; right:8px; top:calc(34px + env(safe-area-inset-top)); margin:0; padding:6px 8px; border-radius:6px; background:var(--warn-soft); color:var(--warn); font:400 12px var(--font-data); }
.status:empty { display:none; }
/* title of the rain panel, pinned to its top-left corner while the chart scrolls underneath */
.rainlab { position:fixed; z-index:1; pointer-events:none; white-space:nowrap; color:#0b3d91; font:700 14px var(--font-display); text-shadow:0 0 3px var(--surface), 0 0 3px var(--surface); }
.rainlab small { margin-left:5px; color:var(--muted); font:400 10px var(--font-data); }
/* how many days fill the screen: three buttons over the right end of the day banner */
.zoomsel { position:fixed; z-index:2; top:env(safe-area-inset-top); right:env(safe-area-inset-right); height:26px; display:flex; align-items:center; gap:3px; padding:0 4px;
  background:var(--surface); border-left:1px solid var(--line); border-bottom:1px solid var(--line); box-sizing:border-box; }
.zoomsel button { margin:0; padding:0; width:34px; height:20px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--muted);
  font:700 11px var(--font-display); -webkit-tap-highlight-color:transparent; }
.zoomsel button.on { background:#0b3d91; border-color:#0b3d91; color:#fff; }
</style></head><body>
<p class="status" id="status"></p>
<div class="rainlab" id="rainlab"></div>
<div class="zoomsel" id="zoomsel"><button data-h="36">1.5d</button><button data-h="72">3d</button><button data-h="0">7d</button></div>
<div class="chart" id="chart">
  <svg id="axL"></svg>
  <div class="scroll"><div class="days" id="days"></div><svg id="wxchart" role="img" aria-label="Hourly forecast chart, 7 days"></svg></div>
  <svg id="axR"></svg>
</div>
<script>
// Location and display settings. Forecast comes from Open-Meteo (free, no API key).
var PLACE = 'NW5 London', LAT = 51.553, LON = -0.142, TZ = 'Europe/London';
var DAYS = 7;                    // number of days to chart, starting today
var ZOOM = 1.3;                  // screen px per chart unit: bigger = larger text
var FIT_HOURS = 36;              // hours across the screen: 36 when the app opens, then whatever the buttons on top set (0 = the whole week)
var BUILD = '2026-10-10e';       // change on every release: a page still running an older build reloads itself
var PXH_MAX = 47;                // most screen px per hour when pinching in (pinching out stops when the whole week is on screen)
var RAIN_SPLIT = 0.30;          // share of the plot height given to the rain panel at the bottom
var STRONG = 25;                 // km/h: the wind/gust band is drawn darker above this level
var ARROW2 = 30, ARROW3 = 45;    // km/h gust: wind arrows get a double head from ARROW2 and a triple head from ARROW3
var REFRESH_MIN = 10;            // re-fetch interval while the page is open
var RAIN_STYLE = 'gradient';     // rain fill: 'gradient' (blue fade), 'bars' (one bar per hour), 'drops' (grey with streaks)
var ICON_SET = 'meteocons';      // 'meteocons' (drawn icons loaded from jsDelivr) or 'emoji'
// Hampstead Heath Lido water temperature, saved to the repo by a scheduled job (the City of London publishes it about weekly)
var LIDO_URL = 'https://raw.githubusercontent.com/pascalconsultingltd-cell/WEATHER/main/lido.json', LIDO = null;
var ICON_BASE = 'https://cdn.jsdelivr.net/gh/basmilius/weather-icons@dev/production/fill/svg-static/';
var PXH = 0, USER_ZOOM = false, PLOTW = 0;   // screen px per hour (set to fit FIT_HOURS until the user pinches), width of the plot on screen
var WIND_TOPS = [15, 30, 45, 60, 90, 120, 150], TEMP_STEPS = [2, 3, 5, 10, 15];   // scales offered when sliding on the wind (left) and temperature (right) axes
var WUSER = 0, TUSER = 0;                    // top of the wind scale and degrees per gridline chosen by sliding on an axis; 0 = automatic
var VIEW = null, CROSS = null;               // geometry of the last drawing, and the crosshair {i: hour index, y: chart units}

// One continuous chart. d: {WIND, GUST (km/h), RAIN (% chance), MM (mm of rain in the hour), TEMP (C), DIR (bearing wind comes FROM), ICON} per hour from 00:00 on day 0,
// SUN: [[sunrise, sunset], ...] per day in decimal hours, DAYS: [{label, short, we}] per day, NOW: hours since 00:00 on day 0.
function drawWeek(d) {
  var WIND = d.WIND, GUST = d.GUST, RAIN = d.RAIN, MM = d.MM, TEMP = d.TEMP, DIR = d.DIR, ICON = d.ICON;
  var chartEl = document.getElementById('chart'), AL = 26, AR = 30;
  PLOTW = chartEl.clientWidth - (AL + AR) * ZOOM;
  if (!USER_ZOOM) PXH = PLOTW / (FIT_HOURS || WIND.length - Math.floor(d.NOW));
  [].forEach.call(document.querySelectorAll('#zoomsel button'), function (b) { b.className = !USER_ZOOM && +b.getAttribute('data-h') === FIT_HOURS ? 'on' : ''; });
  var n = WIND.length, step = PXH / ZOOM, W = n * step, H = Math.max(200, Math.floor((chartEl.clientHeight - 26) / ZOOM)), T = 38, B = 18, ih = H - T - B;
  // two panels: wind and temperature on top (height ihU), rain chance below (height RH, top edge at RTOP)
  var RH = Math.round(ih * RAIN_SPLIT), ihU = ih - RH - 14, RTOP = T + ih - RH;
  var H0 = Math.floor(d.NOW), X0 = H0 * step;
  // how often things are drawn, so they never overlap when the time axis is squeezed
  function every(list, min) { for (var q = 0; q < list.length - 1 && list[q] * step < min; q++); return list[q]; }
  var IK = every([1, 2, 3, 4, 6, 8, 12, 24], 34), HK = every([1, 2, 3, 6, 12], 12), AK = every([1, 2, 3, 4, 6, 8, 12], 12);   // sky icons, hour labels, wind arrows
  var maxG = Math.max.apply(null, GUST);
  var WMAX = WUSER || Math.max(30, Math.ceil(maxG / 30) * 30);     // 3 gridline intervals
  var RMAX = Math.min(100, Math.max(30, Math.ceil(Math.max.apply(null, RAIN) / 30) * 30));
  var MMAX = [1, 2, 4, 6, 10, 20, 40].filter(function (m) { return m >= Math.max.apply(null, MM); })[0] || 80;   // mm scale of the rain bars
  var tLo = Math.min.apply(null, TEMP), tHi = Math.max.apply(null, TEMP);
  var TMIN = Math.floor(tLo / 5) * 5 - 0;
  var TSTEP = Math.max(5, Math.ceil((tHi - TMIN) / 3 / 5) * 5);
  if (TUSER) {   // scale chosen on the axis: start just under the coldest hour, or centre on the week if that cannot hold it all
    TSTEP = TUSER;
    TMIN = Math.floor(tLo / TSTEP) * TSTEP;
    if (TMIN + 3 * TSTEP < tHi) TMIN = Math.round(((tLo + tHi) / 2 - 1.5 * TSTEP) / TSTEP) * TSTEP;
  }
  var TMAX = TMIN + TSTEP * 3;
  var GOLD = '#e0a800', GREY = '#7d8993';
  var RC = RAIN_STYLE === 'drops' ? GREY : 'var(--rain)';   // rain colour
  var mono = 'font-family="DM Mono, monospace"';
  function x(i) { return (i + 0.5) * step; }
  function yW(v) { return T + ihU - (v / WMAX) * ihU; }
  function yR(v) { return T + ih - (v / RMAX) * RH; }
  function yM(v) { return T + ih - (v / MMAX) * RH; }
  function yT(v) { return T + ihU - ((v - TMIN) / (TMAX - TMIN)) * ihU; }
  function clampY(y, rain) { return Math.min(rain ? T + ih : T + ihU, Math.max(rain ? RTOP : T, y)); }
  function curve(pts, cont, rain) {
    var d = (cont ? ' L' : 'M') + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = clampY(p1[1] + (p2[1] - p0[1]) / 6, rain);
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = clampY(p2[1] - (p3[1] - p1[1]) / 6, rain);
      d += ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + p2[0] + ',' + p2[1];
    }
    return d;
  }
  var out = '', axL = '', axR = '';
  // the rain panel has a light blue background
  var DIVY = RTOP - 5, MARINE = '#0b3d91';
  // between the panels: a clear band of background, then the marine-blue top edge of the rain panel with a soft shade under it
  function divider() {
    return '<rect x="0" y="' + (T + ihU + 0.5) + '" width="' + W + '" height="' + (DIVY - T - ihU - 0.5) + '" fill="var(--surface)"/>' +
      '<defs><linearGradient id="wxdiv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + MARINE + '" stop-opacity="0.22"/><stop offset="1" stop-color="' + MARINE + '" stop-opacity="0"/></linearGradient></defs>' +
      '<rect x="0" y="' + DIVY + '" width="' + W + '" height="12" fill="url(#wxdiv)"/>' +
      '<rect x="0" y="' + DIVY + '" width="' + W + '" height="2" fill="' + MARINE + '"/>';
  }
  out += '<rect x="0" y="' + DIVY + '" width="' + W + '" height="' + (T + ih - DIVY) + '" fill="var(--rain)" fill-opacity="0.1"/>';
  function xt(t) { return Math.min(W, Math.max(0, x(0) + t * step)); }   // t = hours since 00:00 on day 0
  var nTop = 2, nH = T + ih - nTop;
  // night shading melts in and out around sunrise and sunset (soft gradient, no hard edge)
  var MELT = 0.7;   // hours of fade each side of the boundary
  function nightRect(id, xa, xb, op0, op1) {
    out += '<defs><linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" x1="' + xa + '" x2="' + xb + '" y1="0" y2="0"><stop offset="0" stop-color="var(--night)" stop-opacity="' + op0 + '"/><stop offset="1" stop-color="var(--night)" stop-opacity="' + op1 + '"/></linearGradient></defs>';
    out += '<rect x="' + xa + '" y="' + nTop + '" width="' + (xb - xa) + '" height="' + nH + '" fill="url(#' + id + ')"/>';
  }
  function solidNight(xa, xb) {
    out += '<rect x="' + xa + '" y="' + nTop + '" width="' + Math.max(0, xb - xa) + '" height="' + nH + '" fill="var(--night)" fill-opacity="0.12"/>';
  }
  d.SUN.forEach(function (s, k) {
    var rise = k * 24 + s[0], set = k * 24 + s[1];
    var prevSet = k ? (k - 1) * 24 + d.SUN[k - 1][1] : null;
    solidNight(k ? xt(prevSet + MELT) : 0, xt(rise - MELT));
    nightRect('wxnr' + k, xt(rise - MELT), xt(rise + MELT), 0.12, 0);
    nightRect('wxns' + k, xt(set - MELT), xt(set + MELT), 0, 0.12);
    if (k === d.SUN.length - 1) solidNight(xt(set + MELT), W);
  });
  // sunny spells (wherever the sky icon is the clear sun) get a yellow shade that melts in and out like the night
  (function () {
    var start = -1;
    function sunny(i) { return i >= H0 && i < n && ICON[IK < 6 ? i - (i - H0) % IK : i][1] === 'clear-day'; }   // the icon shown covers IK hours (hour by hour once the icons are sparse)
    for (var i = H0; i <= n; i++) {
      if (sunny(i)) { if (start < 0) start = i; continue; }
      if (start < 0) continue;
      var xa = (start - MELT) * step, xb = (i + MELT) * step, f = 2 * MELT * step / (xb - xa);
      out += '<defs><linearGradient id="wxsun' + start + '" gradientUnits="userSpaceOnUse" x1="' + xa + '" x2="' + xb + '" y1="0" y2="0"><stop offset="0" stop-color="var(--sun)" stop-opacity="0"/><stop offset="' + f + '" stop-color="var(--sun)" stop-opacity="0.2"/><stop offset="' + (1 - f) + '" stop-color="var(--sun)" stop-opacity="0.2"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></linearGradient></defs>';
      out += '<rect x="' + xa + '" y="' + nTop + '" width="' + (xb - xa) + '" height="' + nH + '" fill="url(#wxsun' + start + ')"/>';
      start = -1;
    }
  })();
  var TAGW = 196;   // width of the now tag
  // moon phase, drawn in the sky in the middle of each night
  function drawMoons() {
    var r = step * 24 < 50 ? 7 : 10;
    for (var k = -1; k < d.SUN.length; k++) {
      var a = k < 0 ? -0.5 : k * 24 + d.SUN[k][1], b = k + 1 < d.SUN.length ? (k + 1) * 24 + d.SUN[k + 1][0] : n - 0.5;
      a = Math.max(a, Math.floor(d.NOW) - 0.5);                      // only the part of the night still on the chart
      if (b - a < 3) continue;
      var t = (a + b) / 2, m = moon(d.T0 + t * 3600000), cx = xt(t), cy = T + 17;
      var label = ((b - a) * step < 95 ? '' : m.name + ' ') + Math.round(m.lit * 100) + '%';   // no room for the name when squeezed
      cx = Math.max(cx, X0 + Math.max(r, label.length * 2.5) + 3);   // kept whole at the left edge
      var p = m.phase < 0.5 ? m.phase : 1 - m.phase;                 // mirrored for the waning half
      var rx = Math.abs(Math.cos(2 * Math.PI * p)) * r;
      out += '<g transform="translate(' + cx + ',' + cy + ')' + (m.phase < 0.5 ? '' : ' scale(-1,1)') + '">' +
        '<circle r="' + r + '" fill="#2b3a55" stroke="#8a97ad" stroke-width="0.6"/>' +
        '<path d="M0,' + (-r) + ' A' + r + ',' + r + ' 0 0 1 0,' + r + ' A' + rx + ',' + r + ' 0 0 ' + (p < 0.25 ? 0 : 1) + ' 0,' + (-r) + ' Z" fill="#f6e7a6"/></g>';
      out += '<text x="' + cx + '" y="' + (cy + r + 10) + '" text-anchor="middle" font-size="8" fill="var(--muted)" ' + mono + '>' + label + '</text>';
    }
  }
  // day's max over min temperature as a big fraction in the middle of each daytime:
  // gold when the daylight hours are mostly sunny, grey when mostly cloudy
  function drawDayTemps() {
    var cy = T + ihU / 2, SUNNY = { 'clear-day': 1, 'partly-cloudy-day': 1, 'overcast-day': 0.5 };   // how sunny each sky icon counts
    d.SUN.forEach(function (s, k) {
      var a = Math.max(k * 24 + s[0], Math.floor(d.NOW) - 0.5), b = k * 24 + s[1];   // daylight still on the chart
      if (b - a < 2) return;
      var t = TEMP.slice(k * 24, k * 24 + 24), cx = xt((a + b) / 2), score = 0, hrs = 0;
      for (var i = k * 24 + Math.ceil(s[0]); i <= k * 24 + Math.floor(s[1]); i++) { score += SUNNY[ICON[i][1]] || 0; hrs++; }
      var col = hrs && score / hrs >= 0.5 ? GOLD : GREY;
      var halo = 'stroke="var(--surface)" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"';
      var fs = Math.max(12, Math.min(24, step * 24 * 0.42)), z = fs / 24;   // shrinks to fit a narrow day
      var att = 'text-anchor="middle" font-size="' + fs + '" font-weight="700" fill="' + col + '" stroke-width="4" paint-order="stroke" ' + halo + ' ' + mono;
      out += '<text x="' + cx + '" y="' + (cy - 7 * z) + '" ' + att + '>' + Math.max.apply(null, t) + '°</text>';
      out += '<line x1="' + (cx - 21 * z) + '" x2="' + (cx + 21 * z) + '" y1="' + cy + '" y2="' + cy + '" stroke-width="6" ' + halo + '/>';
      out += '<line x1="' + (cx - 21 * z) + '" x2="' + (cx + 21 * z) + '" y1="' + cy + '" y2="' + cy + '" stroke="' + col + '" stroke-width="2.4" stroke-linecap="round"/>';
      out += '<text x="' + cx + '" y="' + (cy + 25 * z) + '" ' + att + '>' + Math.min.apply(null, t) + '°</text>';
    });
  }
  // day dividers at midnight
  for (var k = 1; k < d.SUN.length; k++) {
    out += '<line x1="' + (k * 24 * step) + '" x2="' + (k * 24 * step) + '" y1="0" y2="' + H + '" stroke="var(--line)" stroke-width="1"/>';
  }
  for (var g = 0; g <= 3; g++) {
    var gy = T + ihU - (g / 3) * ihU;
    out += '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>';
    axL += '<text x="21" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="var(--wind)" ' + mono + '>' + Math.round(g / 3 * WMAX) + '</text>';
    axR += '<text x="4" y="' + (gy + 3) + '" text-anchor="start" font-size="9" fill="' + GOLD + '" ' + mono + '>' + (TMIN + g * TSTEP) + '°</text>';
  }
  for (g = 0; g <= 2; g++) {
    gy = T + ih - (g / 2) * RH;
    out += '<line x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>';
    axR += '<text x="4" y="' + (gy + 3) + '" text-anchor="start" font-size="9" fill="' + RC + '" ' + mono + '>' + Math.round(g / 2 * RMAX) + '%</text>';
    axL += '<text x="21" y="' + (gy + 3) + '" text-anchor="end" font-size="9" fill="' + MARINE + '" ' + mono + '>' + (g ? g / 2 * MMAX : 'mm') + '</text>';
  }
  var wp = WIND.map(function (v, i) { return [x(i), yW(v)]; });
  var gp = GUST.map(function (v, i) { return [x(i), yW(v)]; });
  var rp = RAIN.map(function (v, i) { return [x(i), yR(v < 5 ? 0 : v)]; });   // no fill below 5%
  var tp = TEMP.map(function (v, i) { return [x(i), yT(v)]; });
  // light green band between the wind curve and the gust curve
  // a scale chosen on an axis can leave part of a curve outside the top panel, so the curves are clipped to it
  out += '<clipPath id="wxup"><rect x="0" y="' + (T - 1) + '" width="' + W + '" height="' + (ihU + 3) + '"/></clipPath>';
  out += '<path d="' + curve(gp) + curve(wp.slice().reverse(), true) + ' Z" fill="var(--wind)" fill-opacity="0.13" stroke="none" clip-path="url(#wxup)"/>';
  // darker where the band rises above the STRONG level
  var yS = yW(STRONG);
  var gy1 = yW(STRONG), gy2 = yW(100);   // 100 km/h sits far above the plot, so the band only reaches the first part of the ramp

    PXH = Math.min(PXH_MAX, Math.max(PLOTW / (VIEW.n - VIEW.H0), w.pxh));
    USER_ZOOM = true;
    drawWeek(VIEW.d);
    sc.scrollLeft = w.hour * PXH - (w.x - sc.getBoundingClientRect().left);   // the hour between the fingers stays between them
  }
  sc.addEventListener('touchstart', function (e) {
    clearTimeout(timer);
    if (e.touches.length === 2) {
      var s = span(e);
      mode = 'pinch'; CROSS = null; drawCross();
      sc.style.overflowX = 'hidden';   // stops the browser scrolling under the pinch; the chart is placed by hand until it ends
      pinch = { dist: s.dist, pxh: PXH, hour: (s.x - svg.getBoundingClientRect().left) / PXH };
    } else if (e.touches.length === 1) {
      mode = 'press'; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      timer = setTimeout(function () { mode = 'cross'; point(); }, 250);
    }
  }, { passive: true });
  sc.addEventListener('touchmove', function (e) {
    if (mode === 'pinch' && e.touches.length === 2) {
      e.preventDefault();
      var s = span(e), busy = want;
      want = { pxh: pinch.pxh * Math.pow(s.dist / pinch.dist, 1.5), hour: pinch.hour, x: s.x };   // a little more zoom than finger travel
      if (!busy) requestAnimationFrame(zoom);
    } else if (mode === 'cross') {
      e.preventDefault();
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      point();
    } else if (mode === 'press' && (Math.abs(e.touches[0].clientX - sx) > 8 || Math.abs(e.touches[0].clientY - sy) > 8)) {
      clearTimeout(timer); mode = 'scroll';
    }
  }, { passive: false });
  function end(e) {
    clearTimeout(timer);
    if (mode === 'press' && e.type === 'touchend') { if (CROSS) { CROSS = null; drawCross(); } else point(); }
    mode = e.touches.length ? 'scroll' : '';   // a finger left over from a pinch does nothing more
    if (!e.touches.length) sc.style.overflowX = '';
  }
  sc.addEventListener('touchend', end);
  sc.addEventListener('touchcancel', end);
  sc.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // Sliding a finger up on the wind (left) or temperature (right) axis expands that scale, sliding down compresses it,
  // one step of the list per 28 px. A tap on the axis goes back to the automatic scale.
  function axis(id, list, cur, set) {
    var el = document.getElementById(id), y0 = 0, i0 = 0, moved = false;
    el.addEventListener('touchstart', function (e) {
      if (!VIEW) return;
      y0 = e.touches[0].clientY; moved = false; i0 = 0;
      for (var k = 1; k < list.length; k++) if (Math.abs(list[k] - cur()) < Math.abs(list[i0] - cur())) i0 = k;
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      if (!VIEW) return;
      e.preventDefault();
      var dy = y0 - e.touches[0].clientY, v = list[Math.min(list.length - 1, Math.max(0, i0 - Math.round(dy / 28)))];
      if (Math.abs(dy) > 8) moved = true;
      if (moved && v !== cur()) { set(v); drawWeek(VIEW.d); }
    }, { passive: false });
    el.addEventListener('touchend', function () { if (VIEW && !moved) { set(0); drawWeek(VIEW.d); } });
  }
  axis('axL', WIND_TOPS, function () { return VIEW.WMAX; }, function (v) { WUSER = v; });
  axis('axR', TEMP_STEPS, function () { return VIEW.TSTEP; }, function (v) { TUSER = v; });
})();
// The buttons on top set how many days fill the screen, keeping the hour at the left edge where it is.
document.getElementById('zoomsel').addEventListener('click', function (e) {
  var h = e.target.getAttribute('data-h'), sc = document.querySelector('.scroll');
  if (h == null || !VIEW) return;
  var hour = sc.scrollLeft / PXH;
  FIT_HOURS = +h; USER_ZOOM = false;
  drawWeek(VIEW.d);
  sc.scrollLeft = hour * PXH;
});
// redraw to the new height when the phone is rotated
window.addEventListener('resize', function () { if (lastData) render(lastData); });
setInterval(load, REFRESH_MIN * 60000);
// refresh every time the page comes back on screen, so "now" is never stale
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && Date.now() - lastLoad > 60000) load();
});
</script>
